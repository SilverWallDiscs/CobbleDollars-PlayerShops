name: Build Pokemon Rental
on:
  push:
    branches: [pokemon-rental-prototype]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: PokemonRental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and remap mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-rental-jar
          path: PokemonRental/build/libs/pokemon-rental-*.jar
          if-no-files-found: error
